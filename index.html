<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gaby</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root{--pink:#ffafcc;--purple:#b392ac;--skyblue:#a2d2ff;--taupe:#d6ccc2}
*{margin:0;padding:0;box-sizing:border-box;-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none}
body,html{width:100%;height:100%;overflow:hidden;font-family:'Poppins',sans-serif;background:linear-gradient(-45deg,#ffafcc,#b392ac,#a2d2ff,#d6ccc2);background-size:400% 400%;animation:gradientBG 15s ease infinite}
@keyframes gradientBG{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
#intro{position:fixed;inset:0;z-index:2000;display:flex;flex-direction:column;justify-content:center;align-items:center;background:rgba(255,255,255,0.1);backdrop-filter:blur(30px);transition:opacity 1s ease,visibility 1s}
.name-intro{font-family:'Great Vibes',cursive;font-size:clamp(4rem,15vw,8rem);line-height:1;color:#FFFFFF;text-shadow:0 0 10px #FFFFFF,0 0 20px #FFFFFF,0 0 30px rgba(255,255,255,0.5);margin-bottom:30px;animation:pulseGlow 2s ease-in-out infinite alternate;text-align:center}
@keyframes pulseGlow{from{text-shadow:0 0 10px #FFFFFF,0 0 20px #FFFFFF}to{text-shadow:0 0 20px #FFFFFF,0 0 40px #FFFFFF,0 0 60px rgba(255,255,255,0.8)}}
.btn-enter{position:relative;padding:clamp(10px,2vh,15px) clamp(30px,5vw,50px);font-size:clamp(1rem,2vh,1.2rem);font-weight:600;color:#fff;background:rgba(255,255,255,0.2);border:1px solid rgba(255,255,255,0.5);border-radius:50px;cursor:pointer;overflow:hidden;backdrop-filter:blur(10px);transition:all 0.3s ease;box-shadow:0 10px 30px rgba(0,0,0,0.1)}
.btn-enter::after{content:'';position:absolute;top:-50%;left:-60%;width:20%;height:200%;background:rgba(255,255,255,0.6);transform:rotate(30deg);animation:sparkle 3s infinite}
@keyframes sparkle{0%{left:-60%}30%{left:120%}100%{left:120%}}
.btn-enter:hover{transform:scale(1.05);background:rgba(255,255,255,0.3);box-shadow:0 15px 40px rgba(255,255,255,0.4)}
#main-content{opacity:0;visibility:hidden;display:flex;justify-content:center;align-items:center;width:100%;height:100%;transition:opacity 1.5s ease;padding:clamp(10px,2vh,20px);position:relative;z-index:10}
.glass-card{background:rgba(255,255,255,0.15);backdrop-filter:blur(25px);border:1px solid rgba(255,255,255,0.4);border-radius:clamp(25px,4vh,40px);width:100%;max-width:450px;padding:clamp(15px,3vh,30px);text-align:center;box-shadow:0 40px 80px rgba(0,0,0,0.1);max-height:98vh;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}
.name-luxury{font-family:'Great Vibes',cursive;font-size:clamp(2.5rem,8vh,4.5rem);color:#FFFFFF;text-shadow:0 0 10px #FFFFFF;line-height:1;margin-bottom:clamp(10px,2vh,15px)}
.profile-pic{width:clamp(100px,22vh,150px);height:clamp(100px,22vh,150px);border-radius:50%;border:clamp(3px,0.5vh,5px) solid #fff;object-fit:cover;margin:0 auto clamp(10px,2vh,15px);box-shadow:0 15px 35px rgba(0,0,0,0.15);transition:transform 0.4s cubic-bezier(0.175,0.885,0.32,1.275);cursor:pointer;flex-shrink:0}
.profile-pic:hover{transform:scale(1.08)}
.friends-container{flex-grow:1;display:flex;flex-direction:column;justify-content:center}
.friend-circle{width:clamp(45px,9vh,68px);height:clamp(45px,9vh,68px);border-radius:50%;background:rgba(255,255,255,0.4);border:1.5px solid white;overflow:hidden;margin-bottom:4px;box-shadow:0 4px 10px rgba(0,0,0,0.1);transition:transform 0.3s ease}
.friend-item:hover .friend-circle{transform:scale(1.1)}
.friend-link{font-size:clamp(0.55rem,1vh,0.65rem);color:#fff;text-decoration:none;background:rgba(0,0,0,0.2);padding:2px 8px;border-radius:20px;transition:background 0.3s}
.friend-name{font-size:clamp(0.65rem,1.2vh,0.8rem);font-weight:600;color:white;margin-bottom:2px}
.butterfly-world-3d{position:fixed;inset:0;pointer-events:none;z-index:1}
.butterfly-wrap-3d{position:absolute;transform:scale(0.35);perspective:800px}
.butterfly-3d{animation:hover_3d 250ms cubic-bezier(.48,.01,.54,1) infinite alternate-reverse;position:relative;transform-style:preserve-3d;transform:rotateX(50deg) rotateY(20deg) rotateZ(-50deg);width:30px}
.butterfly-3d::before{background:#222;border-radius:50%;content:'';display:block;height:110px;left:50%;margin-left:-10px;position:absolute;top:-15px;transform:rotatey(100deg);width:20px;z-index:2}
.wing-3d{display:block;opacity:0.8;position:absolute;top:0;transform-style:preserve-3d}
.wing-3d:first-child{animation:leftflap_3d 250ms infinite alternate-reverse;height:1px;left:0;transform:rotateY(-20deg);transform-origin:700% 50%;width:1px;z-index:3}
.wing-3d:last-child{animation:rightflap_3d 250ms infinite alternate-reverse;right:0;transform:rotateY(200deg);transform-origin:0% 50%;z-index:1}
.bit-3d,.bit-3d::after{border-radius:50%;overflow:hidden;position:absolute;right:0;top:0;transform-origin:100% 50%}
.bit-3d:first-child{height:70px;top:15px;transform:rotateZ(40deg);width:130px}
.bit-3d:first-child::after{content:'';display:inline-block;height:60px;left:-30px;top:5px;width:100px}
.bit-3d:last-child{height:55px;transform:rotateZ(-40deg);width:100px}
.bit-3d:last-child::after{content:'';height:45px;left:-24px;top:5px;width:60px;z-index:1}
.b-pink .bit-3d{background:#ff85a1}.b-pink .bit-3d::after{background:#ffafcc}
.b-blue .bit-3d{background:#4099FF}.b-blue .bit-3d::after{background:#a2d2ff}
.b-purple .bit-3d{background:#8e44ad}.b-purple .bit-3d::after{background:#b392ac}
@keyframes hover_3d{0%{transform:rotateX(50deg) rotateY(20deg) rotateZ(-50deg) translateZ(0px)}100%{transform:rotateX(50deg) rotateY(20deg) rotateZ(-50deg) translateZ(-8px)}}
@keyframes leftflap_3d{0%{transform:rotateY(-20deg)}100%{transform:rotateY(90deg)}}
@keyframes rightflap_3d{0%{transform:rotateY(200deg)}100%{transform:rotateY(90deg)}}
#music-toggle{position:fixed;bottom:clamp(10px,2vh,20px);left:clamp(10px,2vw,20px);z-index:3000;width:clamp(35px,6vh,45px);height:clamp(35px,6vh,45px);background:rgba(255,255,255,0.2);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,0.5);border-radius:50%;display:none;justify-content:center;align-items:center;cursor:pointer;box-shadow:0 10px 20px rgba(0,0,0,0.1);transition:transform 0.3s ease,background 0.3s ease}
#music-toggle:hover{transform:scale(1.1);background:rgba(255,255,255,0.3)}
.info-item{background:rgba(255,255,255,0.2);border:1px solid rgba(255,255,255,0.4);border-radius:12px;padding:clamp(5px,1vh,10px);display:flex;flex-direction:column;align-items:center;justify-content:center}
.info-label{font-size:clamp(0.5rem,1vh,0.6rem);text-transform:uppercase;color:white;opacity:0.6;margin-bottom:2px}
@media(max-height:450px){.glass-card{flex-direction:row;max-width:90vw;padding:10px;align-items:center;gap:15px}.profile-pic{width:100px;height:100px;margin:0}.name-luxury{font-size:2rem}.grid-cols-3{grid-template-columns:repeat(6,1fr);gap:5px}}
</style>
</head>
<body>
<audio id="bg-music" src="musica.mp3" loop preload="auto"></audio>
<div id="music-toggle" onclick="toggleMusic()">
<svg id="icon-play" style="display:none;" width="20" height="20" fill="white" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
<svg id="icon-pause" width="20" height="20" fill="white" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
</div>
<div id="intro"><h1 class="name-intro">Gaby</h1><button class="btn-enter" onclick="startExperience()">Entrar</button></div>
<div class="butterfly-world-3d">
<div class="butterfly-wrap-3d b-pink" style="top:10%;left:5%"><div class="butterfly-3d"><div class="wing-3d"><div class="bit-3d"></div><div class="bit-3d"></div></div><div class="wing-3d"><div class="bit-3d"></div><div class="bit-3d"></div></div></div></div>
<div class="butterfly-wrap-3d b-blue" style="top:15%;right:8%"><div class="butterfly-3d"><div class="wing-3d"><div class="bit-3d"></div><div class="bit-3d"></div></div><div class="wing-3d"><div class="bit-3d"></div><div class="bit-3d"></div></div></div></div>
<div class="butterfly-wrap-3d b-purple" style="top:55%;left:2%"><div class="butterfly-3d"><div class="wing-3d"><div class="bit-3d"></div><div class="bit-3d"></div></div><div class="wing-3d"><div class="bit-3d"></div><div class="bit-3d"></div></div></div></div>
<div class="butterfly-wrap-3d b-pink" style="top:45%;right:4%"><div class="butterfly-3d"><div class="wing-3d"><div class="bit-3d"></div><div class="bit-3d"></div></div><div class="wing-3d"><div class="bit-3d"></div><div class="bit-3d"></div></div></div></div>
<div class="butterfly-wrap-3d b-blue" style="bottom:10%;left:15%"><div class="butterfly-3d"><div class="wing-3d"><div class="bit-3d"></div><div class="bit-3d"></div></div><div class="wing-3d"><div class="bit-3d"></div><div class="bit-3d"></div></div></div></div>
</div>
<div id="main-content">
<div class="glass-card">
<div><h1 class="name-luxury">Gaby</h1><img src="https://xatimg.com/image/kE0XqQ4WiVSH.png" alt="" class="profile-pic" draggable="false"></div>
<div class="mb-4">
<h2 class="text-white text-[clamp(0.55rem,1.2vh,0.7rem)] uppercase tracking-[0.2em] font-semibold mb-2 opacity-80">Sobre mí</h2>
<div class="grid grid-cols-2 gap-3 px-2">
<div class="info-item"><span class="info-label">País</span><img src="https://cdn-icons-png.flaticon.com/512/5344/5344530.png" class="w-5 h-5 object-contain" draggable="false"></div>
<div class="info-item"><span class="info-label">Signo</span><div class="flex items-center gap-1"><span class="text-base">♉</span><span class="text-[clamp(0.65rem,1.2vh,0.75rem)] font-semibold text-white/90">Tauro</span></div></div>
</div>
</div>
<div class="pt-3 border-t border-white/20 friends-container">
<h3 class="text-white text-[clamp(0.55rem,1.2vh,0.7rem)] uppercase tracking-[0.3em] mb-3">Amigos</h3>
<div class="grid grid-cols-3 gap-y-3 gap-x-1">
<div class="friend-item flex flex-col items-center"><div class="friend-circle"><img src="https://xatimg.com/image/2w69Pmroq8vJ.gif" class="w-full h-full object-cover" draggable="false"></div><span class="friend-name">Heis</span><a href="https://xat.me/heis" target="_blank" class="friend-link">Perfil</a></div>
<div class="friend-item flex flex-col items-center"><div class="friend-circle"><img src="https://xatimg.com/image/SfAtzGQLIvoR.jpg" class="w-full h-full object-cover" draggable="false"></div><span class="friend-name">Paulina</span><a href="https://xat.me/iPauLinaaa" target="_blank" class="friend-link">Perfil</a></div>
<div class="friend-item flex flex-col items-center"><div class="friend-circle"><img src="https://xatimg.com/image/HQZI8JaHGwIW.png" class="w-full h-full object-cover" draggable="false"></div><span class="friend-name">Rulis</span><a href="https://xat.me/rulis" target="_blank" class="friend-link">Perfil</a></div>
<div class="friend-item flex flex-col items-center"><div class="friend-circle"><img src="https://i.imgur.com/ThW77Zc.png" class="w-full h-full object-cover" draggable="false"></div><span class="friend-name">Yaaz</span><a href="https://xat.me/yaaz" target="_blank" class="friend-link">Perfil</a></div>
<div class="friend-item flex flex-col items-center"><div class="friend-circle"><img src="https://xatimg.com/image/nW55YBWRcnQW.jpg" class="w-full h-full object-cover" draggable="false"></div><span class="friend-name">Fabi</span><a href="https://xat.me/Fabiii9217" target="_blank" class="friend-link">Perfil</a></div>
<div class="friend-item flex flex-col items-center"><div class="friend-circle"><img src="https://xatimg.com/image/DqVrXU6x43Zm.png" class="w-full h-full object-cover" draggable="false"></div><span class="friend-name">Ashley</span><a href="https://xat.me/solangel" target="_blank" class="friend-link">Perfil</a></div>
</div>
</div>
</div>
</div>
<script>
const audio=document.getElementById('bg-music');const musicToggle=document.getElementById('music-toggle');const iconPlay=document.getElementById('icon-play');const iconPause=document.getElementById('icon-pause');
function startExperience(){const intro=document.getElementById('intro');const main=document.getElementById('main-content');audio.play().then(()=>{musicToggle.style.display='flex';updateMusicIcons(false)}).catch(()=>{musicToggle.style.display='flex';updateMusicIcons(true)});intro.style.opacity='0';setTimeout(()=>{intro.style.visibility='hidden';main.style.visibility='visible';main.style.opacity='1'},1000)}
function toggleMusic(){if(audio.paused){audio.play();updateMusicIcons(false)}else{audio.pause();updateMusicIcons(true)}}
function updateMusicIcons(isPaused){iconPlay.style.display=isPaused?'block':'none';iconPause.style.display=isPaused?'none':'block'}
document.addEventListener('contextmenu',event=>event.preventDefault());
document.onkeydown=function(e){if(e.keyCode==123||e.keyCode==116||(e.ctrlKey&&e.shiftKey&&(e.keyCode==73||e.keyCode==74||e.keyCode==67))||(e.ctrlKey&&(e.keyCode==85||e.keyCode==83||e.keyCode==80||e.keyCode==65||e.keyCode==67||e.keyCode==86||e.keyCode==88)))return!1};
document.addEventListener('dragstart',e=>e.preventDefault());
document.addEventListener('selectstart',e=>e.preventDefault());
</script>
</body>
</html>
