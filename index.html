<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gaby</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --pink: #ffafcc;
            --purple: #b392ac;
            --skyblue: #a2d2ff;
            --taupe: #d6ccc2;
            --butterfly-body: #630;
        }

        /* --- Estilos Base --- */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(-45deg, #ffafcc, #b392ac, #a2d2ff, #d6ccc2);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            user-select: none;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* --- Pantalla de Intro --- */
        #intro {
            position: fixed;
            inset: 0;
            z-index: 2000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(30px);
            transition: opacity 1s ease, visibility 1s;
        }

        .name-intro {
            font-family: 'Great Vibes', cursive;
            font-size: clamp(5rem, 15vw, 8rem);
            line-height: 1;
            color: #FFFFFF;
            text-shadow: 0 0 10px #FFFFFF, 0 0 20px #FFFFFF, 0 0 30px rgba(255, 255, 255, 0.5);
            margin-bottom: 40px;
            animation: pulseGlow 2s ease-in-out infinite alternate;
        }

        @keyframes pulseGlow {
            from { text-shadow: 0 0 10px #FFFFFF, 0 0 20px #FFFFFF; }
            to { text-shadow: 0 0 20px #FFFFFF, 0 0 40px #FFFFFF, 0 0 60px rgba(255, 255, 255, 0.8); }
        }

        .btn-enter {
            position: relative;
            padding: 15px 50px;
            font-size: 1.2rem;
            font-weight: 600;
            color: #fff;
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 50px;
            cursor: pointer;
            overflow: hidden;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .btn-enter::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -60%;
            width: 20%;
            height: 200%;
            background: rgba(255, 255, 255, 0.6);
            transform: rotate(30deg);
            animation: sparkle 3s infinite;
        }

        @keyframes sparkle {
            0% { left: -60%; }
            30% { left: 120%; }
            100% { left: 120%; }
        }

        .btn-enter:hover {
            transform: scale(1.05);
            background: rgba(255, 255, 255, 0.3);
            box-shadow: 0 15px 40px rgba(255, 255, 255, 0.4);
        }

        /* --- Contenido Principal Adaptable --- */
        #main-content {
            opacity: 0;
            visibility: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            transition: opacity 1.5s ease;
            padding: 10px;
            position: relative;
            z-index: 10;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: clamp(30px, 5vh, 50px);
            width: 100%;
            max-width: 480px;
            padding: clamp(15px, 3vh, 35px) 20px;
            text-align: center;
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.1);
            max-height: 95vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .name-luxury {
            font-family: 'Great Vibes', cursive;
            font-size: clamp(3rem, 10vh, 5rem);
            color: #FFFFFF;
            text-shadow: 0 0 10px #FFFFFF;
            line-height: 1;
            margin-bottom: 15px;
        }

        .profile-pic {
            width: clamp(100px, 20vh, 160px);
            height: clamp(100px, 20vh, 160px);
            border-radius: 50%;
            border: 5px solid #fff;
            object-fit: cover;
            margin: 0 auto 15px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
        }
        .profile-pic:hover { transform: scale(1.08); }

        /* --- Amigos Grid --- */
        .friend-circle {
            width: clamp(50px, 8vh, 70px);
            height: clamp(50px, 8vh, 70px);
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.4);
            border: 2px solid white;
            overflow: hidden;
            margin-bottom: 5px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
        }
        .friend-item:hover .friend-circle { transform: scale(1.1); }

        .friend-link {
            font-size: 0.65rem;
            color: #fff;
            text-decoration: none;
            background: rgba(0, 0, 0, 0.2);
            padding: 2px 8px;
            border-radius: 20px;
            transition: background 0.3s;
        }

        /* --- MARIPOSAS CARTOON (ESTILO A) --- */
        .butterfly-container-cartoon {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 1;
        }

        .cartoon-wrapper {
            position: absolute;
            width: 120px;
            height: 120px;
            opacity: 0.6;
        }

        .cartoon {
            position: relative;
            width: 100%;
            height: 100%;
            --body-color: #630;
        }

        .cartoon div { position: absolute; box-sizing: border-box; }
        .r { border-radius: 100%; }
        .hb::before, .ha::after { content: ""; display: block; position: absolute; box-sizing: border-box; }

        .antenna, .cartoon .body {
            width: 4%; height: 4%; background: var(--body-color);
            top: 40%; left: 50%; transform: translate(-50%, -50%);
        }

        .cartoon .body::before {
            width: 60%; height: 1000%; background: var(--body-color);
            left: 50%; transform: translate(-50%, 0); border-radius: 50%;
        }

        .cartoon .body::after {
            width: 150%; height: 400%; background: var(--body-color);
            top: 90%; left: 50%; transform: translate(-50%, 0); border-radius: 50%;
        }

        .antenna {
            box-shadow: -4.1vmin -9.1vmin 0 -1vmin var(--body-color), 4.1vmin -9.1vmin 0 -1vmin var(--body-color);
        }

        .antenna::after, .antenna::before {
            width: 150%; height: 350%; border-radius: 50%;
            left: 80%; bottom: 20%; border: 0.25vmin solid transparent;
            border-left: 0.5vmin solid var(--body-color); transform: rotate(20deg);
        }

        .antenna::after {
            border-left: 0.5vmin solid transparent; border-right: 0.5vmin solid var(--body-color);
            transform: rotate(-20deg); left: -135%;
        }

        .wing-top {
            top: 5%; width: 50%; height: 45%; left: -0.125%;
            background: linear-gradient(darkorange, orange);
            border-radius: 20% 100% 10% 80%; transform-origin: right bottom;
            transform: rotate(-12deg);
            box-shadow: inset 3.5vmin 1.5vmin 0 1vmin, inset -0.5vmin 0 0 1vmin;
            animation: wingTopFlap1 1.5s ease-in-out infinite;
            overflow: hidden;
        }

        .wing-top::after {
            width: 120%; height: 90%; border-radius: 50%;
            transform: rotate(35deg); left: 30%; top: -5%; box-shadow: inset 1vmin -2vmin;
        }

        .wing-top::before {
            width: 64%; height: 25%; transform: rotate(0deg);
            top: 61.5%; border-radius: 50% 50% 40% 60%; box-shadow: -1vmin -0.25vmin 0 1.5vmin;
        }

        .wing-top ~ .wing-top {
            left: 0; transform: scaleX(-1) rotate(-12deg);
            animation: wingTopFlap2 1.5s ease-in-out infinite;
        }

        .dots {
            width: 2vmin; height: 2vmin; background: white; color: white;
            left: 5%; top: 10%;
            box-shadow: -0.5vmin 3vmin, -0.5vmin 6vmin 0 0.125vmin, 1.5vmin -2.25vmin orange, 3.5vmin -3vmin 0 -0.5vmin, 20vmin 7vmin 0 2vmin black, 20vmin 7.25vmin 0 3vmin;
        }

        .wing-bottom {
            width: 28%; height: 40%; background: linear-gradient(95deg, darkorange, orange);
            border-radius: 100% / 125% 125% 70% 50%; transform-origin: right top;
            transform: rotate(55deg); top: 59%; left: 27.5%;
            box-shadow: inset 1vmin -2vmin 0 0.5vmin;
            animation: wingBottomFlap1 1.5s ease-in-out infinite;
            overflow: hidden;
        }

        .wing-bottom ~ .wing-bottom {
            transform: scaleX(-1) rotate(55deg); left: auto; right: 55.5%;
            animation: wingBottomFlap2 1.5s ease-in-out infinite;
        }

        .wing-bottom::before {
            width: 100%; height: 100%; left: 55%; top: -30%;
            border-radius: 50%; box-shadow: -1vmin 0.5vmin, -3vmin 2vmin 0 1vmin orange, -3vmin 3vmin 0 1.5vmin;
        }

        .wing-bottom::after {
            width: 3vmin; height: 3vmin; background: black; top: 70%; left: 15%;
            border-radius: 50%;
            box-shadow: 2vmin 2vmin 0 -0.5vmin, 2.75vmin -0.5vmin 0 -0.5vmin white, 4.25vmin 1.5vmin 0 -0.75vmin red, 11vmin -10vmin 0 1vmin, 15vmin -12vmin 0 -0.5vmin white;
        }

        @keyframes wingTopFlap1 { 0%, 100% { transform: rotate(-12deg); } 50% { transform: rotate(-12deg) rotateY(40deg); } }
        @keyframes wingTopFlap2 { 0%, 100% { transform: scaleX(-1) rotate(-12deg); } 50% { transform: scaleX(-1) rotate(-12deg) rotateY(40deg); } }
        @keyframes wingBottomFlap1 { 0%, 100% { transform: rotate(55deg); } 50% { transform: rotate(55deg) rotateY(40deg); } }
        @keyframes wingBottomFlap2 { 0%, 100% { transform: scaleX(-1) rotate(55deg); } 50% { transform: scaleX(-1) rotate(55deg) rotateY(40deg); } }

        /* --- MARIPOSAS 3D (ESTILO B - ORIGINALES) --- */
        .butterfly-world-3d {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 1;
        }

        .butterfly-wrap-3d {
            position: absolute;
            transform: scale(0.3);
            perspective: 800px;
        }

        .butterfly-3d {
            animation: hover_3d 250ms cubic-bezier(.48,.01,.54,1) infinite alternate-reverse;
            position: relative;
            transform-style: preserve-3d;
            transform: rotateX(50deg) rotateY(20deg) rotateZ(-50deg);
            width: 30px;
        }

        .butterfly-3d::before {
            background: #222;
            border-radius: 50%;
            content: '';
            display: block;
            height: 110px;
            left: 50%;
            margin-left: -10px;
            position: absolute;
            top: -15px;
            transform: rotatey(100deg);
            width: 20px;
            z-index: 2;
        }

        .wing-3d {
            display: block;
            opacity: 0.8;
            position: absolute;
            top: 0;
            transform-style: preserve-3d;
        }

        .wing-3d:first-child {
            animation: leftflap_3d 250ms cubic-bezier(.48,.01,.54,1) infinite alternate-reverse;
            height: 1px;
            left: 0;
            transform: rotateY(-20deg);
            transform-origin: 700% 50%;
            width: 1px;
            z-index: 3;
        }

        .wing-3d:last-child {
            animation: rightflap_3d 250ms cubic-bezier(.48,.01,.54,1) infinite alternate-reverse;
            right: 0;
            transform: rotateY(200deg);
            transform-origin: 0% 50%;
            z-index: 1;
        }

        .bit-3d, .bit-3d::after {
            border-radius: 50%;
            overflow: hidden;
            position: absolute;
            right: 0;
            top: 0;
            transform-origin: 100% 50%;
        }

        .bit-3d:first-child { height: 70px; top: 15px; transform: rotateZ(40deg); width: 130px; }
        .bit-3d:first-child::after { content: ''; display: inline-block; height: 60px; left: -30px; top: 5px; width: 100px; }
        .bit-3d:last-child { height: 55px; transform: rotateZ(-40deg); width: 100px; }
        .bit-3d:last-child::after { content: ''; display: inline-block; height: 45px; left: -24px; top: 5px; width: 60px; z-index: 1; }

        .b-pink .bit-3d { background: #ff85a1; } .b-pink .bit-3d::after { background: #ffafcc; }
        .b-blue .bit-3d { background: #4099FF; } .b-blue .bit-3d::after { background: #a2d2ff; }
        .b-purple .bit-3d { background: #8e44ad; } .b-purple .bit-3d::after { background: #b392ac; }

        @keyframes hover_3d { 
            0% { transform: rotateX(50deg) rotateY(20deg) rotateZ(-50deg) translateZ(0px); }
            100% { transform: rotateX(50deg) rotateY(20deg) rotateZ(-50deg) translateZ(-8px); }
        }
        @keyframes leftflap_3d { 0% { transform: rotateY(-20deg); } 100% { transform: rotateY(90deg); } }
        @keyframes rightflap_3d { 0% { transform: rotateY(200deg); } 100% { transform: rotateY(90deg); } }

        /* --- Reproductor Flotante --- */
        #music-toggle {
            position: fixed;
            bottom: 20px;
            left: 20px;
            z-index: 3000;
            width: 45px;
            height: 45px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            display: none;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }

        /* --- Media Queries --- */
        @media (max-height: 700px) {
            .mb-6 { margin-bottom: 0.5rem !important; }
            .pt-4 { padding-top: 0.5rem !important; }
            .grid-cols-3 { gap: 8px !important; }
            .name-luxury { margin-bottom: 5px; }
            .profile-pic { margin-bottom: 8px; }
        }
    </style>
</head>
<body oncontextmenu="return false;" ondragstart="return false;">

    <!-- Elemento de Audio -->
    <audio id="bg-music" src="musica.mp3" loop preload="auto"></audio>

    <!-- Botón de Música -->
    <div id="music-toggle" onclick="toggleMusic()">
        <svg id="icon-play" style="display: none;" width="20" height="20" fill="white" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        <svg id="icon-pause" width="20" height="20" fill="white" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
    </div>

    <!-- Intro -->
    <div id="intro">
        <h1 class="name-intro">Gaby</h1>
        <button class="btn-enter" onclick="startExperience()">Entrar</button>
    </div>

    <!-- Fondo de Mariposas Cartoon -->
    <div class="butterfly-container-cartoon">
        <div class="cartoon-wrapper" style="top: 10%; left: 5%; transform: scale(0.4) rotate(-15deg);">
            <div class="cartoon hb">
                <div class="wing-bottom ha hb"></div><div class="wing-top ha hb"><div class="dots r"></div></div>
                <div class="wing-bottom ha hb"></div><div class="wing-top ha hb"><div class="dots r"></div></div>
                <div class="body r ha hb"></div><div class="antenna r ha hb"></div>
            </div>
        </div>
        <div class="cartoon-wrapper" style="top: 15%; right: 5%; transform: scale(0.35) rotate(10deg);">
            <div class="cartoon hb">
                <div class="wing-bottom ha hb"></div><div class="wing-top ha hb"><div class="dots r"></div></div>
                <div class="wing-bottom ha hb"></div><div class="wing-top ha hb"><div class="dots r"></div></div>
                <div class="body r ha hb"></div><div class="antenna r ha hb"></div>
            </div>
        </div>
    </div>

    <!-- Fondo de Mariposas 3D (Originales) -->
    <div class="butterfly-world-3d">
        <div class="butterfly-wrap-3d b-pink" style="bottom: 15%; left: 5%;"><div class="butterfly-3d"><div class="wing-3d"><div class="bit-3d"></div><div class="bit-3d"></div></div><div class="wing-3d"><div class="bit-3d"></div><div class="bit-3d"></div></div></div></div>
        <div class="butterfly-wrap-3d b-blue" style="bottom: 10%; right: 10%;"><div class="butterfly-3d"><div class="wing-3d"><div class="bit-3d"></div><div class="bit-3d"></div></div><div class="wing-3d"><div class="bit-3d"></div><div class="bit-3d"></div></div></div></div>
        <div class="butterfly-wrap-3d b-purple" style="top: 50%; left: 2%;"><div class="butterfly-3d"><div class="wing-3d"><div class="bit-3d"></div><div class="bit-3d"></div></div><div class="wing-3d"><div class="bit-3d"></div><div class="bit-3d"></div></div></div></div>
    </div>

    <!-- Contenido Principal -->
    <div id="main-content">
        <div class="glass-card">
            <h1 class="name-luxury">Gaby</h1>

            <img src="https://xatimg.com/image/kE0XqQ4WiVSH.png" alt="Gaby Profile" class="profile-pic" draggable="false">

            <div class="mb-6">
                <h2 class="text-white text-[10px] uppercase tracking-[0.2em] font-semibold mb-3 opacity-80">Sobre mí</h2>
                <div class="grid grid-cols-2 gap-3 px-2">
                    <div class="bg-white/20 border border-white/40 rounded-xl p-2 flex flex-col items-center justify-center">
                        <span class="text-[9px] uppercase text-white opacity-60">País</span>
                        <img src="https://cdn-icons-png.flaticon.com/512/5344/5344530.png" class="w-6 h-6 object-contain">
                    </div>
                    <div class="bg-white/20 border border-white/40 rounded-xl p-2 flex flex-col items-center justify-center">
                        <span class="text-[9px] uppercase text-white opacity-60">Signo</span>
                        <div class="flex items-center gap-1"><span class="text-lg">♉</span><span class="text-xs font-semibold text-white/90">Tauro</span></div>
                    </div>
                </div>
            </div>

            <div class="pt-4 border-t border-white/20">
                <h3 class="text-white text-[9px] uppercase tracking-[0.3em] mb-4">Amigos</h3>
                <div class="grid grid-cols-3 gap-y-4 gap-x-1">
                    <div class="friend-item flex flex-col items-center">
                        <div class="friend-circle"><img src="https://xatimg.com/image/2w69Pmroq8vJ.gif" class="w-full h-full object-cover"></div>
                        <span class="text-white text-[9px] font-semibold mb-1">Heis</span>
                        <a href="https://xat.me/heis" target="_blank" class="friend-link">Perfil</a>
                    </div>
                    <div class="friend-item flex flex-col items-center">
                        <div class="friend-circle"><img src="https://xatimg.com/image/SfAtzGQLIvoR.jpg" class="w-full h-full object-cover"></div>
                        <span class="text-white text-[9px] font-semibold mb-1">Paulina</span>
                        <a href="https://xat.me/iPauLinaaa" target="_blank" class="friend-link">Perfil</a>
                    </div>
                    <div class="friend-item flex flex-col items-center">
                        <div class="friend-circle"><img src="https://xatimg.com/image/HQZI8JaHGwIW.png" class="w-full h-full object-cover"></div>
                        <span class="text-white text-[9px] font-semibold mb-1">Rulis</span>
                        <a href="https://xat.me/rulis" target="_blank" class="friend-link">Perfil</a>
                    </div>
                    <div class="friend-item flex flex-col items-center">
                        <div class="friend-circle"><img src="https://i.imgur.com/ThW77Zc.png" class="w-full h-full object-cover"></div>
                        <span class="text-white text-[9px] font-semibold mb-1">Yaaz</span>
                        <a href="https://xat.me/yaaz" target="_blank" class="friend-link">Perfil</a>
                    </div>
                    <div class="friend-item flex flex-col items-center">
                        <div class="friend-circle"><img src="https://xatimg.com/image/nW55YBWRcnQW.jpg" class="w-full h-full object-cover"></div>
                        <span class="text-white text-[9px] font-semibold mb-1">Fabi</span>
                        <a href="https://xat.me/Fabiii9217" target="_blank" class="friend-link">Perfil</a>
                    </div>
                    <div class="friend-item flex flex-col items-center">
                        <div class="friend-circle"><img src="https://xatimg.com/image/DqVrXU6x43Zm.png" class="w-full h-full object-cover"></div>
                        <span class="text-white text-[9px] font-semibold mb-1">Ashley</span>
                        <a href="https://xat.me/solangel" target="_blank" class="friend-link">Perfil</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const audio = document.getElementById('bg-music');
        const musicToggle = document.getElementById('music-toggle');
        const iconPlay = document.getElementById('icon-play');
        const iconPause = document.getElementById('icon-pause');

        function startExperience() {
            const intro = document.getElementById('intro');
            const main = document.getElementById('main-content');
            
            audio.play().then(() => {
                musicToggle.style.display = 'flex';
                updateMusicIcons(false);
            }).catch(() => {
                musicToggle.style.display = 'flex';
                updateMusicIcons(true);
            });
            
            intro.style.opacity = '0';
            setTimeout(() => {
                intro.style.visibility = 'hidden';
                main.style.visibility = 'visible';
                main.style.opacity = '1';
            }, 1000);
        }

        function toggleMusic() {
            if (audio.paused) { audio.play(); updateMusicIcons(false); }
            else { audio.pause(); updateMusicIcons(true); }
        }

        function updateMusicIcons(isPaused) {
            iconPlay.style.display = isPaused ? 'block' : 'none';
            iconPause.style.display = isPaused ? 'none' : 'block';
        }

        // Bloqueos de seguridad
        document.onkeydown = function(e) {
            if(e.keyCode == 123 || (e.ctrlKey && (e.shiftKey && (e.keyCode == 73 || e.keyCode == 67 || e.keyCode == 74)) || e.keyCode == 85)) return false;
        };
        document.querySelectorAll('img').forEach(img => img.addEventListener('dragstart', (e) => e.preventDefault()));
    </script>
</body>
</html>
